name: Modernize Assess (headless)

# Headless / non-interactive run of the GitHub Copilot modernization agent.
# Based on the official Microsoft docs:
# https://learn.microsoft.com/en-us/azure/developer/github-copilot-app-modernization/modernization-agent/cicd-integration?tabs=github-actions
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional existing issue number to post the assessment summary to. Leave blank to create a new one."
        required: false
        type: string
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

env:
  # Env vars take the highest precedence in the modernize CLI config chain.
  MODERNIZE_LOG_LEVEL: info
  MODERNIZE_MODEL: claude-sonnet-4.6
  MODERNIZE_COLLECT_TELEMETRY: "false"
  # Used by both `gh` CLI and the modernize agent for non-interactive auth.
  GH_TOKEN: ${{ secrets.GH_COPILOT_PAT }}

jobs:
  assess:
    name: Run headless assessment
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Modernize CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/modernize-cli/main/scripts/install.sh | sh

      - name: Verify modernize CLI
        run: |
          modernize --version
          echo "----- modernize --help -----"
          modernize --help || true
          echo "----- modernize assess --help -----"
          modernize assess --help || true

      - name: Verify gh CLI auth
        run: gh auth status

      - name: Resolve or create tracking issue
        id: issue
        env:
          REPO: ${{ github.repository }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ -z "$INPUT_ISSUE" ]; then
            TITLE="Modernization assessment - $(date +%Y-%m-%d)"
            BODY="Automated assessment run from workflow \`${{ github.workflow }}\` (run id ${{ github.run_id }})."
            URL=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY")
          else
            URL="https://github.com/$REPO/issues/$INPUT_ISSUE"
          fi
          echo "Tracking issue: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run headless assessment
        run: |
          mkdir -p ./reports/assessment
          # Marker so we can later list every file modernize wrote.
          touch /tmp/_pre_assess_mark
          modernize assess \
            --no-tty \
            --source . \
            --format markdown \
            --output-path ./reports/assessment \
            --issue-url "${{ steps.issue.outputs.url }}"

      - name: Locate generated report
        if: always()
        run: |
          echo "===== reports/ tree ====="
          ls -laR reports || true
          echo "===== ~/.modernize tree ====="
          ls -laR "$HOME/.modernize" || true
          echo "===== files modernize wrote anywhere under workspace or HOME ====="
          find "$GITHUB_WORKSPACE" "$HOME" -newer /tmp/_pre_assess_mark \
            \( -name '*.md' -o -name '*.html' -o -name '*.json' \) \
            -not -path '*/node_modules/*' 2>/dev/null || true

      - name: Upload assessment report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-report
          path: |
            reports/assessment
            ~/.modernize/**/*.md
            ~/.modernize/**/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Modernize CLI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modernize-logs
          path: ~/.modernize/logs/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Modernization assessment"
            echo ""
            echo "Tracking issue: ${{ steps.issue.outputs.url }}"
            echo "Artifact: \`assessment-report\`"
          } >> "$GITHUB_STEP_SUMMARY"
